services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Sesión 6: mapping table de pseudónimos + jobs de ingesta.
  # La imagen trae pgvector compilado, pero la extensión queda dormida
  # (sin CREATE EXTENSION vector) hasta la migración de la sesión 7.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
      POSTGRES_DB: estimator
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "estimator", "-d", "estimator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sesión 7: servicio IA (FastAPI). Lee el .env y apunta a redis/postgres por nombre de servicio.
  servicio_ia:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://estimator:estimator@postgres:5432/estimator
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
