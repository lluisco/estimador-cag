[project]
name = "estimador-cag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.5.0",
    "es-core-news-md",
    "faker>=24.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=2,<3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "spacy>=3.7",
    "sqlalchemy>=2.0",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.9",
]

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
